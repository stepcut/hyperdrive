target = "https://www.rfc-editor.org/rfc/rfc9110#section-8.4.1.1"

# Compress Coding
#
#    The "compress" coding is an adaptive Lempel-Ziv-Welch (LZW) coding
#    [Welch] that is commonly produced by the UNIX file compression
#    program "compress".  A recipient SHOULD consider "x-compress" to be
#    equivalent to "compress".

[[spec]]
level = "SHOULD"
quote = '''
A recipient SHOULD consider "x-compress" to be
equivalent to "compress".
'''


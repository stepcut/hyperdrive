target = "https://www.rfc-editor.org/rfc/rfc9110#section-15.5.4"

# 403 Forbidden
#
#    The 403 (Forbidden) status code indicates that the server understood
#    the request but refuses to fulfill it.  A server that wishes to make
#    public why the request has been forbidden can describe that reason in
#    the response content (if any).
# 
#    If authentication credentials were provided in the request, the
#    server considers them insufficient to grant access.  The client
#    SHOULD NOT automatically repeat the request with the same
#    credentials.  The client MAY repeat the request with new or different
#    credentials.  However, a request might be forbidden for reasons
#    unrelated to the credentials.
# 
#    An origin server that wishes to "hide" the current existence of a
#    forbidden target resource MAY instead respond with a status code of
#    404 (Not Found).

[[spec]]
level = "SHOULD"
quote = '''
The client
SHOULD NOT automatically repeat the request with the same
credentials.
'''

[[spec]]
level = "MAY"
quote = '''
The client MAY repeat the request with new or different
credentials.
'''

[[spec]]
level = "MAY"
quote = '''
An origin server that wishes to "hide" the current existence of a
forbidden target resource MAY instead respond with a status code of
404 (Not Found).
'''


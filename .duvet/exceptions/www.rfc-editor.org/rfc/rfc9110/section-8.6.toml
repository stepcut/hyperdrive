# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9110#section-8.6"

[[exception]]
quote = '''
A user agent SHOULD send Content-Length in a request when the method
defines a meaning for enclosed content and it is not sending
Transfer-Encoding.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
A user agent SHOULD NOT send a Content-Length header field
when the request message does not contain content and the method
semantics do not anticipate such data.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

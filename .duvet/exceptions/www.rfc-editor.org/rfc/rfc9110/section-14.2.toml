target = "https://www.rfc-editor.org/rfc/rfc9110#section-14.2"

[[exception]]
quote = '''
A proxy MAY discard a Range
header field that contains a range unit it does not understand.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
A
client SHOULD NOT request multiple ranges that are inherently less
efficient to process and transfer than a single range that
encompasses the same data.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
A client that is requesting multiple ranges SHOULD list those ranges
in ascending order (the order in which they would typically be

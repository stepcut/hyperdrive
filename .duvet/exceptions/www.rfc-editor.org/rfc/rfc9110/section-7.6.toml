target = "https://www.rfc-editor.org/rfc/rfc9110#section-7.6"

[[exception]]
quote = '''
An intermediary not acting as a tunnel MUST implement the Connection
header field, as specified in Section 7.6.1, and exclude fields from
being forwarded that are only intended for the incoming connection.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
An intermediary MUST NOT forward a message to itself unless it is
protected from an infinite request loop.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9110#section-7.6.3"

[[exception]]
quote = '''
A proxy MUST send an appropriate Via header field, as described
below, in each message that it forwards.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
An HTTP-to-HTTP gateway
MUST send an appropriate Via header field in each inbound request
message and MAY send a Via header field in forwarded response
messages.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
However, if the real host is considered to be sensitive
information, a sender MAY replace it with a pseudonym.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
A sender MAY generate comments to identify the software of each
recipient, analogous to the User-Agent and Server header fields.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
However, comments in Via are optional, and a recipient MAY remove
them prior to forwarding the message.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
An intermediary used as a portal through a network firewall SHOULD
NOT forward the names and ports of hosts within the firewall region
unless it is explicitly enabled to do so.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
If not enabled, such an
intermediary SHOULD replace each received-by host of any host behind
the firewall by an appropriate pseudonym for that host.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
An intermediary MAY combine an ordered subsequence of Via header

'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
A sender MUST NOT combine members that have
different received-protocol values.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

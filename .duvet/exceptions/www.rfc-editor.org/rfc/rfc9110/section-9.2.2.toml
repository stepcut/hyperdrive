target = "https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2"

[[exception]]
quote = '''
A client SHOULD NOT automatically retry a request with a non-
idempotent method unless it has some means to know that the request
semantics are actually idempotent, regardless of the method, or some
means to detect that the original request was never applied.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
A proxy MUST NOT automatically retry non-idempotent requests.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''

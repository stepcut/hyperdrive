target = "https://www.rfc-editor.org/rfc/rfc9110#section-9.3.7"

[[exception]]
quote = '''
A client MAY send a Max-Forwards header field in an OPTIONS request
to target a specific recipient in the request chain (see
Section 7.6.2).
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
A proxy MUST NOT generate a Max-Forwards header
field while forwarding a request unless that request was received
with a Max-Forwards field.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''

[[exception]]
quote = '''
A client that generates an OPTIONS request containing content MUST

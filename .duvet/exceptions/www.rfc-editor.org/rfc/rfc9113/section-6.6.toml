# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9113#section-6.6"

[[exception]]
quote = '''
The promised stream
identifier MUST be a valid choice for the next stream sent by the
sender (see "new stream identifier" in Section 5.1.1).
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
A PUSH_PROMISE frame without the END_HEADERS flag set MUST be
followed by a CONTINUATION frame for the same stream.
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
PUSH_PROMISE frames MUST only be sent on a peer-initiated stream that
is in either the "open" or "half-closed (remote)" state.
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
PUSH_PROMISE MUST NOT be sent if the SETTINGS_ENABLE_PUSH setting of
the peer endpoint is set to 0.
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
A sender MUST NOT send a PUSH_PROMISE on a stream
unless that stream is either "open" or "half-closed (remote)"; the
sender MUST ensure that the promised stream is a valid choice for a
new stream identifier (Section 5.1.1) (that is, the promised stream
MUST be in the "idle" state).
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
However, an endpoint that
has sent RST_STREAM on the associated stream MUST handle PUSH_PROMISE
frames that might have been created before the RST_STREAM frame is
received and processed.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

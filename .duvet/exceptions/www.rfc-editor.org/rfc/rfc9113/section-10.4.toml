# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9113#section-10.4"

[[exception]]
quote = '''
Where multiple tenants share space on the same server, that server
MUST ensure that tenants are not able to push representations of
resources that they do not have authority over.
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
Pushed responses for which an origin server is not authoritative (see
Section 10.1) MUST NOT be used or cached.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

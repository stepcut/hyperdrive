# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9113#section-6.5.2"

[[exception]]
quote = '''
A server MUST NOT send a PUSH_PROMISE frame
if it receives this parameter set to a value of 0; see
Section 8.4.
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
A client that has both set this parameter to 0 and
had it acknowledged MUST treat the receipt of a PUSH_PROMISE frame
as a connection error (Section 5.4.1) of type PROTOCOL_ERROR.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
A client MUST treat
receipt of a SETTINGS frame with SETTINGS_ENABLE_PUSH set to 1 as
a connection error (Section 5.4.1) of type PROTOCOL_ERROR.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

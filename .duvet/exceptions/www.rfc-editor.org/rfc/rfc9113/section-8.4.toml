# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9113#section-8.4"

[[exception]]
quote = '''
Promised requests MUST be safe (see Section 9.2.1 of [HTTP]) and
cacheable (see Section 9.2.3 of [HTTP]).
'''
reason = '''
Applies to sending server push, which hyperdrive does not do (docs/http2-core-design.md, D7).
'''

[[exception]]
quote = '''
Clients that receive a
promised request that is not cacheable, that is not known to be safe,
or that indicates the presence of request content MUST reset the
promised stream with a stream error (Section 5.4.2) of type
PROTOCOL_ERROR.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
Pushed responses that are not cacheable MUST NOT be stored by any
HTTP cache.
'''
reason = '''
Applies to caches; hyperdrive does not cache responses.
'''

[[exception]]
quote = '''
A
client MUST treat a PUSH_PROMISE for which the server is not
authoritative as a stream error (Section 5.4.2) of type
PROTOCOL_ERROR.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

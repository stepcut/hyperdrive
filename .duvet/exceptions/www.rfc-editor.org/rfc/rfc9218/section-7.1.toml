# generated by scripts/duvet-exceptions
target = ".duvet/specifications/www.rfc-editor.org/rfc/rfc9218.txt#section-7.1"

[[exception]]
quote = '''
When the PRIORITY_UPDATE frame applies to a request stream, clients
SHOULD provide a prioritized stream ID that refers to a stream in the
"open", "half-closed (local)", or "idle" state (i.e., streams where
data might still be received).
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
When the PRIORITY_UPDATE frame applies to a push stream, clients
SHOULD provide a prioritized stream ID that refers to a stream in the
"reserved (remote)" or "half-closed (local)" state.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
Clients MUST NOT provide a prioritized stream ID
that refers to a push stream in the "idle" state.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
If a client receives a
PRIORITY_UPDATE frame, it MUST respond with a connection error of
type PROTOCOL_ERROR.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

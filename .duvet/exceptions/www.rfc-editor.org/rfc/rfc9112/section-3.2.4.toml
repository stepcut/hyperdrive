# generated by scripts/duvet-exceptions
target = "https://www.rfc-editor.org/rfc/rfc9112#section-3.2.4"

[[exception]]
quote = '''
When a client wishes to request OPTIONS for the server as a whole, as
opposed to a specific named resource of that server, the client MUST
send only "*" (%x2A) as the request-target.
'''
reason = '''
Applies to clients and user agents; hyperdrive is a server.
'''

[[exception]]
quote = '''
If a proxy receives an OPTIONS request with an absolute-form of
request-target in which the URI has an empty path and no query
component, then the last proxy on the request chain MUST send a
request-target of "*" when it forwards the request to the indicated
origin server.
'''
reason = '''
Applies to proxies, gateways and tunnels; hyperdrive is an origin server.
'''
